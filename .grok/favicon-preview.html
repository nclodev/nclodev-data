<!doctype html>
<html><head><style>
html,body{margin:0;padding:0;background:#888;}
.row{display:flex;gap:24px;padding:16px;align-items:flex-end;}
.box{display:flex;flex-direction:column;align-items:center;gap:6px;font:11px sans-serif;color:#111;}
img.s16{width:16px;height:16px;image-rendering:auto;background:#fff;}
img.s32{width:32px;height:32px;background:#fff;}
img.s64{width:64px;height:64px;background:#111;}
</style></head>
<body>
<div class="row">
  <div class="box"><img class="s16" src="favicon.svg.tmp"><span>16 light</span></div>
  <div class="box"><img class="s32" src="favicon.svg.tmp"><span>32</span></div>
  <div class="box" style="background:#111;padding:8px;"><img class="s64" src="favicon.svg.tmp"><span style="color:#eee">64 dark</span></div>
</div>
</body></html>
